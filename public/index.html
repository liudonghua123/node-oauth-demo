<!DOCTYPE html>
<html>

<head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Node OAuth2 Demo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
        <a id="login">Login with YNU</a>

<script>
  // fill in your cliend_id
  const client_id = '1353774962342612992';

  const authorize_uri = 'https://ids.ynu.edu.cn/authserver/oauth2.0/authorize';
  // const authorize_uri = 'https://ids.ynu.edu.cn/authserver/oidc/authorize';
  const redirect_uri = `${new URL(location.href).origin}/oauth/redirect`;

  const link = document.getElementById('login');
  link.href = `${authorize_uri}?response_type=code&client_id=${client_id}&redirect_uri=${encodeURIComponent(redirect_uri)}`;
  // link.href = `${authorize_uri}?response_type=code&client_id=${client_id}&redirect_uri=${redirect_uri}`;
</script>

</body>

</html>
